{{/*
  Wrapper ServiceMonitor — replaces the subchart's ServiceMonitor to enable
  Helm template rendering inside metricRelabelings (the subchart uses toYaml,
  not tpl, so .Values.global.cluster_name is inaccessible there).

  Always drops aws_zoa_* metrics whose dimension_Cluster doesn't match the
  current cluster.  In shared AWS accounts (ephemeral) this prevents cross-
  cluster ZOA EMF pollution; in isolated accounts (int/stage/prod) every
  dimension_Cluster already matches, so the rules are harmless no-ops.

  The 2-step mark-then-drop pattern works around RE2's lack of negative
  lookahead.  Temporary __tmp_* labels are automatically stripped before
  storage by the Prometheus scrape pipeline.
*/}}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudwatch-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-yet-another-cloudwatch-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  endpoints:
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
      metricRelabelings:
        {{- toYaml .Values.serviceMonitor.metricRelabelings | nindent 8 }}
        # Drop aws_zoa_* metrics from other clusters.
        # In shared AWS accounts (ephemeral), YACE's customNamespace job scrapes
        # all ZOA EMF metrics account-wide because customNamespace has no tag-based
        # filtering.  In isolated accounts (int/stage/prod), dimension_Cluster
        # always matches so these rules are harmless no-ops.
        #
        # 2-step mark-then-drop works around RE2's lack of negative lookahead.
        # Temporary __tmp_* labels are stripped automatically before storage.
        - sourceLabels: [__name__, dimension_Cluster]
          regex: 'aws_zoa_.+;{{ .Values.global.cluster_name }}'
          targetLabel: __tmp_zoa_mine
          replacement: 'y'
        - sourceLabels: [__name__, __tmp_zoa_mine]
          regex: 'aws_zoa_.+;'
          action: drop
  jobLabel: cloudwatch-exporter
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-yet-another-cloudwatch-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
