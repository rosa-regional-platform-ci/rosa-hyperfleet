{{- if gt (int .Values.hcpSlots.count) 0 }}
# Slot nodes carry no per-HCP taint, so isolation relies on every pod in a
# control plane namespace selecting its own cluster and slot. HyperShift sets
# that nodeSelector on the pods it creates from HostedCluster.spec.nodeSelector
# (which the Seaplane Operator sets to the cluster + slot, and HyperShift copies
# onto the HostedControlPlane). This policy rejects any pod whose nodeSelector
# does not carry the whole of the HostedControlPlane's nodeSelector — for
# example one created by another operator in the namespace, or a workload trying
# to land on another HCP's nodes.
#
# The source of truth is the HostedControlPlane's spec.nodeSelector (the policy
# parameter), not a label the operator has to stamp on the namespace. Before the
# HostedControlPlane exists, parameterNotFoundAction: Deny fails closed; the
# pod's ReplicaSet or StatefulSet retries until it does.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hcp-pod-placement
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: hypershift.openshift.io/v1beta1
    kind: HostedControlPlane
  matchConstraints:
    namespaceSelector:
      matchLabels:
        hypershift.openshift.io/hosted-control-plane: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: hcpSelector
      expression: "params.spec.?nodeSelector.orValue({})"
    - name: podSelector
      expression: "object.spec.?nodeSelector.orValue({})"
  validations:
    # The HostedControlPlane must pin its pods somewhere; an empty nodeSelector
    # would make the subset check below vacuous and admit any pod.
    - expression: "size(variables.hcpSelector) > 0"
      messageExpression: >-
        'HostedControlPlane in ' + object.metadata.namespace +
        ' has no spec.nodeSelector; its pods are admitted once it is set'
      reason: Forbidden
    # Every key the HostedControlPlane selects on must be present on the pod with
    # the same value, so the pod can only land on this control plane's nodes.
    - expression: >-
        variables.hcpSelector.all(k,
          k in variables.podSelector && variables.podSelector[k] == variables.hcpSelector[k])
      messageExpression: >-
        'control plane pods must carry the HostedControlPlane nodeSelector: ' +
        variables.hcpSelector.map(k, k + '=' + variables.hcpSelector[k]).join(', ')
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hcp-pod-placement
spec:
  policyName: hcp-pod-placement
  # The parameter is the HostedControlPlane in the pod's own namespace: namespace
  # is left unset so the request's namespace is used, and Deny fails closed when
  # it does not exist yet.
  paramRef:
    selector: {}
    parameterNotFoundAction: Deny
  validationActions:
    {{- toYaml .Values.hcpSlots.guardrail.validationActions | nindent 4 }}
{{- end }}
