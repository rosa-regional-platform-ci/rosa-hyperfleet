apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
handler: {{ .Values.runtimeClass.handler }}
overhead:
  podFixed:
    cpu: {{ .Values.runtimeClass.overhead.cpu }}
    memory: {{ .Values.runtimeClass.overhead.memory }}
