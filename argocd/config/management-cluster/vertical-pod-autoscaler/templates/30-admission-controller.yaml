{{- if .Values.vpa.enabled }}
# Webhook serving certificate from cert-manager, which runs on every MC: a
# self-signed CA issues the serving certificate, cainjector puts the CA into
# the webhook configuration, and the admission controller reloads renewed
# certificates from disk (--reload-cert). The certificate stays the same across
# Argo CD syncs, so admission never fails open because of a sync.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vpa-selfsigned
  namespace: {{ .Release.Namespace }}
  annotations:
    # cert-manager CRDs may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-webhook-ca
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: true
  commonName: vpa-webhook-ca
  secretName: vpa-webhook-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vpa-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vpa-webhook-ca
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    secretName: vpa-webhook-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vpa-webhook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: vpa-webhook-tls
  dnsNames:
    - vpa-webhook.{{ .Release.Namespace }}.svc
    - vpa-webhook.{{ .Release.Namespace }}.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: vpa-webhook-ca
    kind: Issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpa-admission-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: vpa-admission-controller
spec:
  replicas: {{ .Values.vpa.admissionController.replicas }}
  selector:
    matchLabels:
      app: vpa-admission-controller
  template:
    metadata:
      labels:
        app: vpa-admission-controller
    spec:
      serviceAccountName: vpa-admission-controller
      {{- include "vpa.podCommon" . | nindent 6 }}
      {{- include "vpa.spread" "vpa-admission-controller" | nindent 6 }}
      containers:
        - name: admission-controller
          image: {{ .Values.vpa.image }}
          command: ["/usr/bin/admission-controller"]
          env:
            # Namespace of the status lease the updater reads.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --v={{ .Values.vpa.logLevel }}
            # The MutatingWebhookConfiguration below is managed by Argo CD.
            - --register-webhook=false
            - --reload-cert=true
            - --client-ca-file=/etc/tls-certs/ca.crt
            - --tls-cert-file=/etc/tls-certs/tls.crt
            - --tls-private-key=/etc/tls-certs/tls.key
          ports:
            - name: webhook
              containerPort: 8000
            - name: prometheus
              containerPort: 8944
          {{- include "vpa.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.vpa.admissionController.resources | nindent 12 }}
          securityContext:
            {{- include "vpa.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: vpa-webhook-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vpa-admission-controller
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vpa-admission-controller
---
apiVersion: v1
kind: Service
metadata:
  name: vpa-webhook
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: vpa-admission-controller
  ports:
    - port: 443
      targetPort: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: vpa-webhook-config
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/vpa-webhook
webhooks:
  - name: vpa.k8s.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      # caBundle is injected by cert-manager's cainjector; the ApplicationSet
      # ignores caBundle drift on webhook configurations.
      service:
        name: vpa-webhook
        namespace: {{ .Release.Namespace }}
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    reinvocationPolicy: Never
    sideEffects: None
    timeoutSeconds: {{ .Values.vpa.admissionController.timeoutSeconds }}
    namespaceSelector:
      {{- toYaml .Values.vpa.admissionController.namespaceSelector | nindent 6 }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
      - apiGroups: ["autoscaling.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["verticalpodautoscalers"]
        scope: Namespaced
{{- end }}
