aws-load-balancer-controller:
  # clusterName and vpcId injected via ApplicationSet valuesObject
  vpcId: ""
  # The chart regenerates webhook TLS certs on every render because ArgoCD
  # doesn't support Helm's lookup function (argoproj/argo-cd#5202).
  # keepTLSSecret has no effect for the same reason (aws-load-balancer-controller#2312).
  # The ApplicationSet ignores the webhook Secret's data and caBundle, so the app
  # stays Synced; both are replaced together whenever the app syncs.
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
