aws-load-balancer-controller:
  # clusterName and vpcId injected via ApplicationSet valuesObject
  vpcId: ""
  # Known OutOfSync: the chart regenerates webhook TLS certs on every render
  # because ArgoCD doesn't support Helm's lookup function (argoproj/argo-cd#5202).
  # keepTLSSecret has no effect for the same reason (aws-load-balancer-controller#2312).
  # The webhook Secret and caBundle will always show OutOfSync — this is cosmetic,
  # the controller works correctly.
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
