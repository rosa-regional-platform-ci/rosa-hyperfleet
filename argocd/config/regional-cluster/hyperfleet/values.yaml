hyperfleet:
  applicationName: hyperfleet-operator

  namespace: argocd

  targetNamespace: hyperfleet

  project: default

  source:
    repoURL: https://github.com/typeid/hyperfleet-operator.git
    targetRevision: main
    path: charts/hyperfleet-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/psav/hyperfleet-operator
      tag: "4cc6e5f"
      pullPolicy: Always

    # tablePrefix is set at deploy time via the ApplicationSet valuesObject
    # using global.cluster_name (e.g. "eph-af848c21-rc01-"). Placeholder here
    # so helm lint passes.
    tablePrefix: ""

    replicaCount: 2

    serviceAccount:
      create: true
      name: hyperfleet-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
