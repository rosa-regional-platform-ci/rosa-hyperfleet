seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-api.git
    targetRevision: f59b0034c13cf39d506e2ead73ebd0b5cd42cd1e
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/rosa-seaplane-operator
      tag: "on-pr-f4f7046ac03989a6d2783ed3307dd245773e7209@sha256:4d0a3ee2404a423cc8c1bfa35ab9df56b31a84dd534a4162274c82b0a4d45ed9"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

