      repository: quay.io/redhat-user-workloads/rosa-tenant/hyperfleet-operator
      tag: "on-pr-bb56e40b5cb148c7d6371bc08a69ffe667d20f58@sha256:2764b07452fe95ff7de46a9a7ca361b91af48d3bfdd437ae4e2fa96ec487186e"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
