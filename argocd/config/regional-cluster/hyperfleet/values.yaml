seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-api.git
    targetRevision: d5b3d26182dff389f38396398167300fc4f59069
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/cbusse_openshift/seaplane-operator
      tag: "hcp-isolation-d5b3d26"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# HCP slots per management cluster (config: management_cluster_defaults.hcp_slot_count).
# The Seaplane Operator places each HostedCluster on a free slot, so this is the
# most HostedClusters an MC holds. Required, 1 to 99.
hcpSlotCount: null
