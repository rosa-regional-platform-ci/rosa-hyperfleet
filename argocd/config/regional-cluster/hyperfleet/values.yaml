seaplane:
  applicationName: seaplane-operator

  namespace: argocd

  targetNamespace: seaplane

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-seaplane-api.git
    targetRevision: f59b0034c13cf39d506e2ead73ebd0b5cd42cd1e
    path: seaplane-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/hyperfleet-operator
      tag: "on-pr-21b6593f2679248ae83d36b25f20d798d7f88a9a@sha256:dd41786a5bb721b213eeebe83e30cf1f04598d8202f09abbd93b900cb6999012"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: seaplane-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

