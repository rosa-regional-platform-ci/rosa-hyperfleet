global:
  git_revision: unknown
platformApi:
  namespace: platform-api
  serviceAccount:
    create: true
    name: platform-api-sa
    annotations: {}
  app:
    name: platform-api
    image:
      repository: quay.io/rrp-dev-ci/rosa-regional-platform-api
      tag: ci-174-2080747832146399232
      pullPolicy: Always
    args:
      logLevel: info
      logFormat: json
      allowedAccounts: '123456789012'
      dynamodbRegion: us-east-2
      dynamodbPrefix: rosa
      oidcIssuerBaseURL: ''
      apiPort: 8000
      healthPort: 8081
      metricsPort: 9090
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  hyperfleetdb:
    secretName: hyperfleet-db-dsn
    secretKey: dsn
  envoy:
    image:
      repository: envoyproxy/envoy
      tag: v1.31-latest
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  deployment:
    replicas: 2
  service:
    type: ClusterIP
    ports:
      http: 8080
      api: 8000
      health: 8081
      metrics: 9090
  targetGroup:
    arn: PLACEHOLDER
    targetType: ip
  zoa:
    enabled: true
    tableName: ''
    auditTableName: ''
    bucketName: ''
    jobImage: quay.io/slopezz/zoa-tools:e777d69
    ttlSeconds: '3600'
    executionTimeoutSeconds: '1800'
    writeCooldownSeconds: '300'
    maxConcurrentPerTarget: '10'
    dynamodbTTLDays: '365'
    jobResources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
