apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-ratelimit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: redis-ratelimit
    app.kubernetes.io/component: rate-limiting
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-ratelimit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-ratelimit
        app.kubernetes.io/component: rate-limiting
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args:
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu }}
              memory: {{ .Values.redis.resources.requests.memory }}
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu }}
              memory: {{ .Values.redis.resources.limits.memory }}
      volumes:
        - name: redis-config
          configMap:
            name: redis-ratelimit-config
