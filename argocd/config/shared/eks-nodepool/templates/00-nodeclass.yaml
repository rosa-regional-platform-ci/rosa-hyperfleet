{{- $clusterName := required "global.cluster_name must be set via ApplicationSet valuesObject" .Values.global.cluster_name -}}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: bottlerocket-fips
  annotations:
    # Karpenter CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Karpenter alias doesn't support FIPS variants: https://github.com/aws/karpenter-provider-aws/issues/8198
  amiFamily: {{ if .Values.eksNodePool.ami }}{{ .Values.eksNodePool.ami.family }}{{ else }}Bottlerocket{{ end }}
  amiSelectorTerms:
    {{- if .Values.eksNodePool.ami }}
    - id: {{ .Values.eksNodePool.ami.id }}
    {{- else }}
    - name: bottlerocket-aws-k8s-1.34-fips-x86_64-*
    {{- end }}
  instanceProfile: {{ $clusterName }}-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        kubernetes.io/cluster/{{ $clusterName }}: owned
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: {{ $clusterName }}
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  {{- if and .Values.eksNodePool.ami (eq .Values.eksNodePool.ami.family "Custom") }}
  # amiFamily Custom means Karpenter generates no bootstrap, so supply the
  # nodeadm NodeConfig ourselves. Only valid for the Custom family: other
  # families (Bottlerocket, AL2023, ...) have Karpenter generate their own
  # (differently formatted) bootstrap, so userData must not be set for them.
  # Name-only: nodeadm resolves the API server endpoint, cluster CA, and service
  # CIDR via eks:DescribeCluster (granted by AmazonEKSWorkerNodePolicy on the
  # karpenter node role) and computes maxPods from the VPC CNI ENI limits, so no
  # cluster facts need threading in here.
  # NOTE: there is no eks VPC endpoint, so this DescribeCluster call reaches the
  # EKS API via NAT egress. If the cluster ever goes fully private (no NAT),
  # bake apiServerEndpoint/certificateAuthority/cidr into the NodeConfig below
  # (as the Terraform bootstrap node group does) or add an eks VPC endpoint.
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="//"

    --//
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      cluster:
        name: {{ $clusterName }}

    --//--
  {{- end }}
