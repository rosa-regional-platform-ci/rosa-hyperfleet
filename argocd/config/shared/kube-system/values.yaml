# AWS VPC CNI values. Cluster identity and image registry values are injected
# by the ECS bootstrap task and the ArgoCD ApplicationSet at runtime.
aws-vpc-cni:
  fullnameOverride: aws-node
  originalMatchLabels: true

  serviceAccount:
    create: true
    name: aws-node

  image:
    tag: v1.22.4-eksbuild.3

  init:
    image:
      tag: v1.22.4-eksbuild.3

  nodeAgent:
    image:
      tag: v1.4.0-eksbuild.1

  livenessProbe:
    exec:
      command:
        - /app/grpc-health-probe
        - -addr=unix:///var/run/aws-node/ipamd.sock
        - -connect-timeout=5s
        - -rpc-timeout=5s
    initialDelaySeconds: 60

  readinessProbe:
    exec:
      command:
        - /app/grpc-health-probe
        - -addr=unix:///var/run/aws-node/ipamd.sock
        - -connect-timeout=5s
        - -rpc-timeout=5s
    initialDelaySeconds: 1
