# Reference CI config for rosa-hyperfleet-zoa in openshift/release.
# Copy this to: ci-operator/config/openshift-online/rosa-hyperfleet-zoa/openshift-online-rosa-hyperfleet-zoa-main.yaml
#
# Key differences from the standard single-image pattern (rosa-hyperfleet-api):
# 1. Two images: zoa-lambda (Containerfile) and zoa-runner (Containerfile.runner)
# 2. Override target is config/defaults.yaml (Terraform), not argocd values (Helm)
# 3. Custom image-push step (ci/zoa-image-push.sh) to mirror both images
# 4. Override YAML uses separate lambda/runner tag and source image variables

# --- Merge into existing images section (or add if new) ---
images:
  - dockerfile_path: Containerfile
    to: zoa-lambda
  - dockerfile_path: Containerfile.runner
    to: zoa-runner

# --- Add to existing tests section ---
tests:
  - always_run: false
    as: rosa-hyperfleet-compatibility-e2e
    steps:
      dependencies:
        CI_ZOA_LAMBDA_IMAGE: zoa-lambda
        CI_ZOA_RUNNER_IMAGE: zoa-runner
      env:
        ROSA_REGIONAL_COMPONENT_NAME: "zoa"
        ROSA_REGIONAL_HELM_VALUES_FILE: "config/defaults.yaml"
        ROSA_REGIONAL_HELM_OVERRIDE_YAML: |
          regional_cluster:
            zoa_lambda_image_tag: IMAGE_TAG
            zoa_runner_image_tag: IMAGE_TAG
            zoa_lambda_source_image: IMAGE_REPO
            zoa_runner_source_image: RUNNER_IMAGE_REPO
        ROSA_REGIONAL_QUAY_DEST_REPO: "quay.io/rrp-dev-ci/zoa-lambda"
        ROSA_REGIONAL_QUAY_RUNNER_DEST_REPO: "quay.io/rrp-dev-ci/zoa-runner"
      workflow: rosa-hyperfleet-ephemeral-e2e

# --- Manual steps ---
# 1. Create quay.io repos:
#    - quay.io/rrp-dev-ci/zoa-lambda (public)
#    - quay.io/rrp-dev-ci/zoa-runner (public)
#    Grant the rosa-regional-platform-dev-ci-quay-push robot account push access.
#
# 2. The image-push step needs to be adapted for two images.
#    See ci/zoa-image-push.sh in rosa-hyperfleet for the script.
#    Either:
#    a) Create a ZOA-specific step in the step-registry that calls this script
#    b) Extend the existing rosa-hyperfleet-image-push step to support EXTRA_COMPONENTS
#
# 3. The provision step's override substitution needs to handle RUNNER_IMAGE_REPO
#    in addition to the standard IMAGE_REPO/IMAGE_TAG placeholders.
#    The runner uses the same tag (same PR commit), just a different repo.
#
# 4. Run `make update && make checkconfig` in openshift/release
# 5. Open PR in openshift/release
# 6. Trigger with: /test rosa-hyperfleet-compatibility-e2e
