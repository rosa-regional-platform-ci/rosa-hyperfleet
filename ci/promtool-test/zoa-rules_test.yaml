evaluation_interval: 1m

rule_files:
  - rules.yaml

tests:
  # ──────────────────────────────────────────────────────────────
  # Recording rule tests
  # ──────────────────────────────────────────────────────────────

  # Global weighted TA success rate: 90/100 = 0.9
  - interval: 1m
    input_series:
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="get_pods",dimension_Status="succeeded"}'
        values: "80x10"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="get_pods",dimension_Status="failed"}'
        values: "10x10"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="must_gather",dimension_Status="succeeded"}'
        values: "10x10"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="must_gather",dimension_Status="failed"}'
        values: "0x10"
    promql_expr_test:
      - expr: zoa:ta_success_rate{cluster="mc-01"}
        eval_time: 5m
        exp_samples:
          - labels: 'zoa:ta_success_rate{cluster="mc-01"}'
            value: 0.9
      - expr: zoa:ta_total_executions{cluster="mc-01"}
        eval_time: 5m
        exp_samples:
          - labels: 'zoa:ta_total_executions{cluster="mc-01"}'
            value: 100

  # API availability: 80/100 = 0.8
  - interval: 1m
    input_series:
      - series: 'aws_zoa_http_request_count_sum{cluster="mc-01",dimension_StatusClass="2xx"}'
        values: "80x10"
      - series: 'aws_zoa_http_request_count_sum{cluster="mc-01",dimension_StatusClass="5xx"}'
        values: "20x10"
    promql_expr_test:
      - expr: zoa:api_availability{cluster="mc-01"}
        eval_time: 5m
        exp_samples:
          - labels: 'zoa:api_availability{cluster="mc-01"}'
            value: 0.8

  # Lambda error rate: combined api+worker (12/200 = 6%)
  - interval: 1m
    input_series:
      - series: 'aws_lambda_errors_sum{cluster="mc-01",dimension_FunctionName="eph-mc01-zoa-api"}'
        values: "2x10"
      - series: 'aws_lambda_errors_sum{cluster="mc-01",dimension_FunctionName="eph-mc01-zoa-worker"}'
        values: "10x10"
      - series: 'aws_lambda_invocations_sum{cluster="mc-01",dimension_FunctionName="eph-mc01-zoa-api"}'
        values: "100x10"
      - series: 'aws_lambda_invocations_sum{cluster="mc-01",dimension_FunctionName="eph-mc01-zoa-worker"}'
        values: "100x10"
    promql_expr_test:
      - expr: zoa:lambda_error_rate{cluster="mc-01"}
        eval_time: 5m
        exp_samples:
          - labels: 'zoa:lambda_error_rate{cluster="mc-01"}'
            value: 0.06

  # ──────────────────────────────────────────────────────────────
  # Alert tests — CRITICAL
  # ──────────────────────────────────────────────────────────────

  # DLQ growing: mc-05 gains 5 messages in 30min → fires warning
  - interval: 1m
    input_series:
      - series: 'aws_sqs_approximate_number_of_messages_visible_maximum{cluster="mc-05",dimension_QueueName="eph-mc05-zoa-dlq"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 36m
        alertname: ZOADLQGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: mc-05
            exp_annotations:
              summary: ZOA dead-letter queue is actively growing
              description: "ZOA DLQ on cluster mc-05 gained 30 messages in the last 30min. Lambda invocations are crashing before the handler runs."
              runbook: "1. DLQ messages are raw Lambda invocation events (not re-executable). They indicate Lambda-level crashes (OOM, init panic, runtime error). 2. Check CloudWatch Logs for the affected Lambda function for crash details. 3. If OOM: increase memory in Terraform zoa-lambda module. 4. If init panic: check recent image deployments, may need rollback. 5. Execution state is in DynamoDB. The reconciler timeoutDispatched() will mark stale executions as timed_out. 6. To clean up: AWS Console, SQS, Purge queue. Messages have no operational value beyond diagnostics. 7. Alert auto-recovers when no new messages arrive for 30min."

  # DLQ stable: 2 messages stuck but not growing → does NOT fire
  - interval: 1m
    input_series:
      - series: 'aws_sqs_approximate_number_of_messages_visible_maximum{cluster="mc-01",dimension_QueueName="eph-mc01-zoa-dlq"}'
        values: "2x40"
    alert_rule_test:
      - eval_time: 36m
        alertname: ZOADLQGrowing
        exp_alerts: []

  # Reconciler stalled: mc-05 freezes after 2 ticks, mc-01 keeps ticking
  # time() - last_run > 600 first true at t=13m, fires after for:5m at t=18m
  - interval: 1m
    input_series:
      - series: 'aws_zoa_reconciler_last_run_maximum{cluster="mc-01"}'
        values: "0+60x25"
      - series: 'aws_zoa_reconciler_last_run_maximum{cluster="mc-05"}'
        values: "0 60 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120 120"
    alert_rule_test:
      - eval_time: 19m
        alertname: ZOAReconcilerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: mc-05
            exp_annotations:
              summary: ZOA reconciler has stopped ticking
              description: ZOA reconciler on cluster mc-05 has not ticked in >10m (expected every 60s). Async TA results will not be recorded. Check EventBridge schedule and worker Lambda health.
              runbook: "1. Check EventBridge schedule: AWS Console, EventBridge, Rules, filter by cluster ID, verify 1-minute rate schedule is enabled. 2. Check worker Lambda health: CloudWatch, Lambda, filter by cluster, look for invocation errors or throttling. 3. Check if Lambda can reach EKS: look for circuit breaker state changes in ZOA dashboard Worker Pipeline section. 4. If EventBridge schedule is missing, re-run the ZOA Terraform module. 5. Alert auto-recovers when reconciler resumes ticking."

  # DynamoDB throttling → warning (sustained throttling for >15m)
  - interval: 1m
    input_series:
      - series: 'aws_dynamodb_throttled_requests_sum{cluster="mc-05",dimension_TableName="eph-mc05-zoa-executions"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ZOADynamoDBThrottled
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: mc-05
              dimension_TableName: eph-mc05-zoa-executions
            exp_annotations:
              summary: ZOA DynamoDB table eph-mc05-zoa-executions is being throttled
              description: DynamoDB throttles detected on table eph-mc05-zoa-executions (cluster mc-05) for >15m. Execution state and audit writes may be degraded.
              runbook: "1. Check the throttled table in AWS Console: DynamoDB, Tables, select the table from the alert. 2. Check capacity mode: if provisioned, consider switching to on-demand or increasing RCU/WCU. 3. Check for hot partitions: CloudWatch, DynamoDB, per-partition metrics. 4. Common cause: burst of TA executions exceeding provisioned capacity. 5. Alert auto-recovers when throttling stops."

  # Total failure: 0% success with >10 executions → critical
  - interval: 1m
    input_series:
      - series: 'aws_zoa_execution_count_sum{cluster="mc-05",dimension_Action="get_pods",dimension_Status="failed"}'
        values: "20x20"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-05",dimension_Action="get_pods",dimension_Status="succeeded"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ZOAExecutionsTotalFailure
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: mc-05
            exp_annotations:
              summary: ZOA executions almost completely failing
              description: ZOA on cluster mc-05 global TA success rate is 0% (<10%) for 15m. Likely a dependency failure (EKS, S3, STS). Check dashboard for per-action breakdown.
              runbook: "1. Open ZOA dashboard, check Activity Overview for which statuses dominate. 2. Check Executions by Action and Status panel to identify if all or specific actions are failing. 3. If all kube-api scope TAs fail: EKS is likely unreachable. Check circuit breaker panel and EKS cluster health. 4. If all aws-api scope TAs fail: STS AssumeRole is likely failing. Check IAM roles and STS regional endpoint health. 5. If only async TAs fail: check K8s Job creation and runner image availability. 6. If only a specific action fails: check that action RBAC and dependencies. 7. Alert auto-recovers when success rate rises above 10%."

  # Total failure: low traffic (<10) should NOT fire even at 0%
  - interval: 1m
    input_series:
      - series: 'aws_zoa_execution_count_sum{cluster="mc-06",dimension_Action="get_pods",dimension_Status="failed"}'
        values: "3x20"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-06",dimension_Action="get_pods",dimension_Status="succeeded"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ZOAExecutionsTotalFailure
        exp_alerts: []

  # ──────────────────────────────────────────────────────────────
  # Alert tests — WARNING
  # ──────────────────────────────────────────────────────────────

  # Lambda error rate: 10% with >10 invocations → fires warning
  - interval: 1m
    input_series:
      - series: 'aws_lambda_errors_sum{cluster="mc-05",dimension_FunctionName="eph-mc05-zoa-api"}'
        values: "5x20"
      - series: 'aws_lambda_errors_sum{cluster="mc-05",dimension_FunctionName="eph-mc05-zoa-worker"}'
        values: "5x20"
      - series: 'aws_lambda_invocations_sum{cluster="mc-05",dimension_FunctionName="eph-mc05-zoa-api"}'
        values: "50x20"
      - series: 'aws_lambda_invocations_sum{cluster="mc-05",dimension_FunctionName="eph-mc05-zoa-worker"}'
        values: "50x20"
    alert_rule_test:
      - eval_time: 11m
        alertname: ZOALambdaErrorRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: mc-05
            exp_annotations:
              summary: ZOA Lambda error rate elevated
              description: ZOA Lambda functions on cluster mc-05 error rate is 10% (>5%) for 10m. Covers both API and worker Lambdas.
              runbook: "1. Check Lambda error details in CloudWatch Logs, filter by cluster and function name (api or worker). 2. Look for OOM kills (Runtime.ExitError), init failures, or handler panics. 3. If OOM: increase Lambda memory in Terraform zoa-lambda module. 4. If init panic: check recent ZOA image deployments, may need rollback. 5. If sporadic: may be transient AWS issue, monitor for self-recovery. 6. Alert auto-recovers when error rate drops below 5%."

  # Lambda error rate: low traffic should NOT fire
  - interval: 1m
    input_series:
      - series: 'aws_lambda_errors_sum{cluster="mc-06",dimension_FunctionName="eph-mc06-zoa-worker"}'
        values: "2x20"
      - series: 'aws_lambda_invocations_sum{cluster="mc-06",dimension_FunctionName="eph-mc06-zoa-worker"}'
        values: "3x20"
    alert_rule_test:
      - eval_time: 11m
        alertname: ZOALambdaErrorRateHigh
        exp_alerts: []

  # TA success rate below SLO: 10% success, >10 execs → fires
  - interval: 1m
    input_series:
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="must_gather",dimension_Status="succeeded"}'
        values: "1x20"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="must_gather",dimension_Status="failed"}'
        values: "9x20"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="get_pods",dimension_Status="succeeded"}'
        values: "1x20"
      - series: 'aws_zoa_execution_count_sum{cluster="mc-01",dimension_Action="get_pods",dimension_Status="failed"}'
        values: "9x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: ZOATASuccessRateBelowSLO
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: mc-01
            exp_annotations:
              summary: ZOA TA success rate below SLO
              description: ZOA on cluster mc-01 global TA success rate is 10% (target 0.95) for 15m. Check dashboard for per-action breakdown.
              runbook: "1. Open ZOA dashboard Executions by Action and Status panel to identify which actions are failing. 2. Check Activity Overview By Scope to see if kube-api or aws-api is affected. 3. If a single action is failing: check that action RBAC, timeout, and target resource availability. 4. If many actions fail: likely a shared dependency issue, see ZOAExecutionsTotalFailure runbook. 5. Alert auto-recovers when success rate rises above 0.95."
