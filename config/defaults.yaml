git:
  revision: main
  bootstrap_revision: main
deployment_name: '{{ aws_region }}'
aws:
  account_id: ssm:///infra/{{ environment }}/{{ aws_region }}/account_id
  management_cluster_account_id: ssm:///infra/{{ environment }}/{{ aws_region }}/{{
    cluster_prefix }}/account_id
  child_admin_role_name: OrganizationAccountAccessRole
dns:
  domain: ''
  create_environment_zone: false
terraform_tags:
  app_code: infra
  service_phase: dev
  cost_center: '000'
worker_node_ami: null
worker_node_root_volume_size: 50
regional_cluster:
  enable_bastion: false
  enable_cloudtrail: false
  enable_api_custom_domain: false
  enable_rate_limit_redis: true
  enable_write_sre_tools: false
  zone_shard_count: 1
  node_instance_families:
  - m8i
  - m7i
  hyperfleet_db_instance_class: db.r6g.large
  hyperfleet_db_deletion_protection: true
  hyperfleet_db_skip_final_snapshot: false
  hyperfleet_db_performance_insights_enabled: true
  hyperfleet_db_monitoring_interval: 60
  enable_sre_tools_gateway: false
  enable_sre_public_access: false
  sre_allowed_source_cidrs: []
  enable_sre_oidc_auth: false
  sre_oidc_issuer_url: https://auth.redhat.com/auth/realms/EmployeeIDP
  sre_grafana_oidc_client_id: ''
  sre_argocd_oidc_client_id: ''
  sre_prometheus_oidc_client_id: ''
  sre_thanos_oidc_client_id: ''
  zoa_lambda_image_tag: ci-89-2099929222490361856
  zoa_runner_image_tag: ci-89-2099929222490361856
  zoa_lambda_source_image: quay.io/rrp-dev-ci/zoa-lambda
  zoa_runner_source_image: quay.io/rrp-dev-ci/zoa-runner
management_cluster_defaults:
  enable_bastion: false
  node_instance_families:
  - m8i
  - m7i
observability:
  pagerduty:
    enabled: false
    escalation_policy_id: P5KE444
  sns_alerting:
    enabled: true
cluster_lifecycle:
  default_expiration: ''
applications:
  management-cluster:
    eksNodePool:
      instanceFamilies: '{{ management_cluster_defaults.node_instance_families }}'
      ami: '{{ worker_node_ami }}'
      rootVolumeSize: '{{ worker_node_root_volume_size }}Gi'
    hypershift:
      oidcStorageS3Bucket:
        name: hypershift-mc-{{ aws_region }}
        region: '{{ aws_region }}'
      externalDns:
        domain: '{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif
          %}'
  regional-cluster:
    eksNodePool:
      instanceFamilies: '{{ regional_cluster.node_instance_families }}'
      ami: '{{ worker_node_ami }}'
      rootVolumeSize: '{{ worker_node_root_volume_size }}Gi'
    baseDomain: '{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif
      %}'
    platformApi:
      app:
        args:
          defaultClusterExpiration: '{{ cluster_lifecycle.default_expiration }}'
    hyperfleet:
      oidcS3Bucket: PLACEHOLDER-overridden-by-terraform-output
    pagerduty:
      enabled: '{{ observability.pagerduty.enabled | default(false) }}'
    grafana:
      grafana.ini:
        auth.anonymous:
          org_role: '{% if regional_cluster.enable_write_sre_tools %}Admin{% else
            %}Viewer{% endif %}'
        users:
          auto_assign_org_role: '{% if regional_cluster.enable_write_sre_tools %}Admin{%
            else %}Viewer{% endif %}'
    argo-cd:
      configs:
        cm:
          admin.enabled: '{% if regional_cluster.enable_write_sre_tools %}true{% else
            %}false{% endif %}'
          users.anonymous.enabled: '{% if regional_cluster.enable_write_sre_tools
            %}false{% else %}true{% endif %}'
        rbac:
          policy.default: '{% if regional_cluster.enable_write_sre_tools %}{% else
            %}role:readonly{% endif %}'
