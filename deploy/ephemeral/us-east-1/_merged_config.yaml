# Merged config: defaults.yaml → ephemeral/defaults.yaml → ephemeral/us-east-1.yaml
# This file is the output of stage 1 (merge). Stage 2 feeds it to config/templates/.

git:
  revision: main
  bootstrap_revision: main
deployment_name: "{{ aws_region }}{% if eph_prefix %}-{{ eph_prefix }}{% endif %}"
aws:
  account_id: '720644165472'
  management_cluster_account_id: '129678139271'
  child_admin_role_name: OrganizationAccountAccessRole
dns:
  domain: "{% if ci %}ci00{% else %}dev0{% endif %}.rosa.devshift.net"
  create_environment_zone: false
terraform_tags:
  app_code: infra
  service_phase: dev
  cost_center: '000'
regional_cluster:
  enable_bastion: true
  enable_cloudtrail: false
  enable_api_custom_domain: false
  enable_rate_limit_redis: true
  enable_write_sre_tools: true
  zone_shard_count: 1
  node_instance_families: ["m8i-flex", "m7i-flex"]
  hyperfleet_db_instance_class: "db.t4g.medium"
  hyperfleet_db_deletion_protection: false
  hyperfleet_db_skip_final_snapshot: true
  hyperfleet_db_performance_insights_enabled: false
  hyperfleet_db_monitoring_interval: 0
  enable_sre_tools_gateway: true
  enable_sre_public_access: false
  sre_allowed_source_cidrs: []
  enable_sre_oidc_auth: false
  sre_oidc_issuer_url: https://auth.redhat.com/auth/realms/EmployeeIDP
  sre_grafana_oidc_client_id: ''
  sre_argocd_oidc_client_id: ''
  sre_prometheus_oidc_client_id: ''
  sre_thanos_oidc_client_id: ''
  zoa_lambda_image_tag: ci-84605-2096871648534728704
  zoa_runner_image_tag: ci-84605-2096871648534728704
  zoa_lambda_source_image: quay.io/rrp-dev-ci/zoa-lambda
  zoa_runner_source_image: quay.io/rrp-dev-ci/zoa-runner
management_cluster_defaults:
  enable_bastion: true
  node_instance_families: ["m8i-flex", "m7i-flex"]
  karpenter_ami:
observability:
  pagerduty:
    enabled: false
    escalation_policy_id: P5KE444
  sns_alerting:
    enabled: true
applications:
  management-cluster:
    eksNodePool:
      instanceFamilies: '{{ management_cluster_defaults.node_instance_families }}'
      ami: '{{ management_cluster_defaults.karpenter_ami }}'
    hypershift:
      oidcStorageS3Bucket:
        name: hypershift-mc-{{ aws_region }}
        region: '{{ aws_region }}'
      externalDns:
        domain: '{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif %}'
  regional-cluster:
    eksNodePool:
      instanceFamilies: '{{ regional_cluster.node_instance_families }}'
    baseDomain: '{% if dns.domain %}{{ deployment_name }}.{{ dns.domain }}{% endif %}'
    hyperfleet:
      oidcS3Bucket: "hypershift-{{ eph_prefix }}-regional-oidc-{{ account_id }}"
    pagerduty:
      enabled: '{{ observability.pagerduty.enabled | default(false) }}'
    grafana:
      grafana.ini:
        auth.anonymous:
          org_role: '{% if regional_cluster.enable_write_sre_tools %}Admin{% else %}Viewer{% endif %}'
        users:
          auto_assign_org_role: '{% if regional_cluster.enable_write_sre_tools %}Admin{% else %}Viewer{% endif %}'
    argo-cd:
      configs:
        cm:
          admin.enabled: '{% if regional_cluster.enable_write_sre_tools %}true{% else %}false{% endif %}'
          users.anonymous.enabled: '{% if regional_cluster.enable_write_sre_tools %}false{% else %}true{% endif %}'
        rbac:
          policy.default: '{% if regional_cluster.enable_write_sre_tools %}{% else %}role:readonly{% endif %}'
provision_mcs:
  mc01:
    delete: true
delete: true
